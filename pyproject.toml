[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "visionqc"
version = "0.1.0"
description = "Detección de defectos en panetones con visión por computadora (MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Entrenamiento local y export a ONNX
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "onnxruntime>=1.18",
]
# Descarga de datasets públicos desde Roboflow Universe
roboflow = ["roboflow>=1.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
visionqc = "visionqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
